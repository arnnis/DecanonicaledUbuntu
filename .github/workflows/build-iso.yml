name: Build Decanonicaled Ubuntu ISO (Build Farm)

on:
  workflow_dispatch:
    inputs:
      ubuntu_codename:
        description: "Ubuntu codename (resolute = 26.04 LTS, noble = 24.04 LTS, jammy = 22.04 LTS)"
        required: true
        default: "resolute"
        type: choice
        options:
          - resolute
          - noble
          - jammy
      flavor:
        description: "System flavor"
        required: true
        default: "gnome-minimal"
        type: choice
        options:
          - gnome-minimal
          - xfce
          - server
      build_scope:
        description: "Source build scope: core (kernel + base) or full (all resolved flavor sources)"
        required: true
        default: "core"
        type: choice
        options:
          - core
          - full
      publish_apt_repo:
        description: "Publish compiled .debs to sharded GitHub Releases (apt-pool-<codename>-*)"
        required: true
        default: true
        type: boolean
      iso_name:
        description: "Output ISO base filename"
        required: false
        default: "decanonicaled-ubuntu"
        type: string
      reuse_farm_run_id:
        description: "Optional: existing workflow run ID to reuse compiled farm-debs-* artifacts (skips build-farm)"
        required: false
        default: ""
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

env:
  UBUNTU_CODENAME: ${{ github.event.inputs.ubuntu_codename || 'resolute' }}
  FLAVOR: ${{ github.event.inputs.flavor || 'gnome-minimal' }}
  BUILD_SCOPE: ${{ github.event.inputs.build_scope || 'core' }}
  PUBLISH_APT_REPO: ${{ github.event.inputs.publish_apt_repo || 'true' }}
  ISO_NAME: ${{ github.event.inputs.iso_name || 'decanonicaled-ubuntu' }}

jobs:
  plan-farm:
    name: Plan Build Farm Batches
    if: ${{ inputs.reuse_farm_run_id == '' }}
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.resolve.outputs.batches }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve source packages into farm batches
        id: resolve
        run: |
          chmod +x scripts/resolve-sources.sh
          BATCHES_JSON="$(./scripts/resolve-sources.sh)"
          echo "batches=${BATCHES_JSON}" >> "$GITHUB_OUTPUT"
          echo "=== Planned Farm Batches ==="
          echo "${BATCHES_JSON}" | jq .

  build-farm:
    name: Farm Worker (${{ matrix.batch.id }})
    needs: plan-farm
    if: ${{ inputs.reuse_farm_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        batch: ${{ fromJson(needs.plan-farm.outputs.batches) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize available disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup || true
          sudo docker system prune -af || true
          sudo apt-get clean

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ env.UBUNTU_CODENAME }}-${{ matrix.batch.id }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ env.UBUNTU_CODENAME }}-${{ matrix.batch.id }}-
            ccache-${{ env.UBUNTU_CODENAME }}-

      - name: Compile assigned source packages in target container
        env:
          PACKAGES: ${{ matrix.batch.packages }}
          OUT_DIR: ${{ github.workspace }}/out-debs
        run: |
          chmod +x scripts/build-package.sh
          ./scripts/build-package.sh

      - name: Upload compiled .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: farm-debs-${{ matrix.batch.id }}
          path: out-debs/*
          if-no-files-found: warn
          retention-days: 7

  build-iso:
    name: Publish Sharded APT Repo & Build ISO
    needs: [plan-farm, build-farm]
    if: ${{ !cancelled() && (inputs.reuse_farm_run_id != '' || needs.build-farm.result != 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Maximize available disk space
        run: |
          sudo rm -rf /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup || true
          sudo docker system prune -af || true
          sudo apt-get clean
          df -h

      - name: Download all farm-compiled .deb packages (current run)
        if: ${{ inputs.reuse_farm_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          pattern: farm-debs-*
          path: farm-debs-raw
          merge-multiple: true

      - name: Download all farm-compiled .deb packages (reused run)
        if: ${{ inputs.reuse_farm_run_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: farm-debs-*
          path: farm-debs-raw
          merge-multiple: true
          run-id: ${{ inputs.reuse_farm_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect .debs and report any farm failures
        run: |
          mkdir -p farm-debs
          find farm-debs-raw -name '*.deb' -exec mv -n {} farm-debs/ \; || true
          echo "=== Total farm-compiled .deb packages: $(find farm-debs -name '*.deb' | wc -l) ==="
          if [[ -f farm-debs-raw/failed.txt ]]; then
            echo "=== Warning: Some source packages failed to build ==="
            cat farm-debs-raw/failed.txt
          fi
          rm -rf farm-debs-raw

      - name: Install ISO & APT repo dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-efi-ia32-bin \
            mtools \
            dosfstools \
            syslinux-common \
            syslinux-utils \
            isolinux \
            dpkg-dev \
            apt-utils \
            git \
            curl \
            gnupg \
            ca-certificates

      - name: Publish sharded APT repo to GitHub Releases
        if: env.PUBLISH_APT_REPO == 'true'
        id: publish_shards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          chmod +x scripts/publish-release-shards.sh
          WORK_DIR="$PWD/release-shards" NEW_DEBS_DIR="$PWD/farm-debs" ./scripts/publish-release-shards.sh

          SHARD_URLS=""
          while IFS= read -r tag; do
            [[ -z "${tag}" ]] && continue
            SHARD_URLS="${SHARD_URLS} https://github.com/${{ github.repository }}/releases/download/${tag}"
          done < "$PWD/release-shards/shards.txt"
          echo "shard_urls=${SHARD_URLS# }" >> "$GITHUB_OUTPUT"

      - name: Clone Ubuntu livecd-rootfs source
        run: |
          git clone --depth 1 https://git.launchpad.net/livecd-rootfs upstream-livecd-rootfs
          echo "Cloned livecd-rootfs at commit: $(git -C upstream-livecd-rootfs rev-parse --short HEAD)"

      - name: Build de-bloated Ubuntu ISO with farm packages
        env:
          FARM_DEBS_DIR: ${{ github.workspace }}/farm-debs
          APT_SHARD_URLS: ${{ steps.publish_shards.outputs.shard_urls }}
          APT_GPG_KEY_FILE: ${{ github.workspace }}/release-shards/decanonicaled.gpg
        run: |
          chmod +x scripts/build-iso.sh
          sudo --preserve-env=UBUNTU_CODENAME,FLAVOR,ISO_NAME,FARM_DEBS_DIR,APT_SHARD_URLS,APT_GPG_KEY_FILE ./scripts/build-iso.sh

      - name: Generate SHA256 checksums
        run: |
          mkdir -p dist
          sudo mv build/*.iso dist/
          sudo chown -R "$USER:$USER" dist
          cd dist
          sha256sum *.iso > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}-${{ env.UBUNTU_CODENAME }}-${{ env.FLAVOR }}-${{ env.BUILD_SCOPE }}
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  test-iso:
    name: QEMU Boot Test (BIOS & UEFI)
    needs: build-iso
    if: ${{ !cancelled() && needs.build-iso.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Maximize disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          sudo apt-get clean

      - name: Download built ISO artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}-${{ env.UBUNTU_CODENAME }}-${{ env.FLAVOR }}-${{ env.BUILD_SCOPE }}
          path: iso-dist

      - name: Verify ISO checksum
        run: |
          cd iso-dist
          sha256sum -c SHA256SUMS

      - name: Audit ISO manifest (zero bloat & required packages)
        run: |
          ISO_FILE="$(find iso-dist -maxdepth 1 -name '*.iso' | head -n 1)"
          sudo mkdir -p /mnt/iso
          sudo mount -o loop,ro "${ISO_FILE}" /mnt/iso
          MANIFEST="/mnt/iso/casper/filesystem.manifest"
          FARM_COUNT=$(grep -c '+decanonicaled' "${MANIFEST}" || true)
          TOTAL_COUNT=$(wc -l < "${MANIFEST}")
          echo "=== Farm-compiled (+decanonicaled) packages: ${FARM_COUNT} / ${TOTAL_COUNT} ==="
          if [[ "${FARM_COUNT}" -eq 0 ]]; then
            echo "ERROR: 0 farm-compiled (+decanonicaled) packages found in ISO manifest!" >&2
            sudo umount /mnt/iso
            exit 1
          fi
          FORBIDDEN_RE='^(snapd|ubuntu-report|popularity-contest|whoopsie|apport|apport-gtk|ubuntu-advantage-tools|ubuntu-pro-client)\s'
          if grep -E "${FORBIDDEN_RE}" "${MANIFEST}"; then
            echo "ERROR: Forbidden package found in ISO manifest!" >&2
            sudo umount /mnt/iso
            exit 1
          fi
          sudo umount /mnt/iso

      - name: Install QEMU & OVMF (UEFI)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            ovmf \
            python3-pil

      - name: Boot ISO in QEMU (BIOS & UEFI) and capture screenshots
        run: |
          ISO_FILE="$(find iso-dist -maxdepth 1 -name '*.iso' | head -n 1)"
          mkdir -p test-results

          ACCEL_ARGS="-accel tcg"
          if [[ -e /dev/kvm ]] && sudo chmod 666 /dev/kvm 2>/dev/null; then
            ACCEL_ARGS="-enable-kvm -cpu host"
            echo "KVM acceleration enabled!"
          else
            echo "KVM unavailable; using TCG software emulation."
          fi

          run_boot_test() {
            local mode="$1"
            local port="$2"
            local extra_args="$3"
            echo "=== Starting ${mode} boot test (QMP port ${port}) ==="

            qemu-system-x86_64 \
              -m 4096 -smp 4 ${ACCEL_ARGS} \
              ${extra_args} \
              -cdrom "${ISO_FILE}" -boot d \
              -vga std -display none \
              -serial "file:test-results/${mode}-serial.log" \
              -qmp "tcp:127.0.0.1:${port},server,nowait" &
            local qpid=$!

            python3 - "${mode}" "${port}" <<'PY'
          import json, socket, sys, time
          from PIL import Image

          mode = sys.argv[1]
          port = int(sys.argv[2])
          sock = None
          for _ in range(15):
              try:
                  sock = socket.create_connection(("127.0.0.1", port), timeout=10)
                  break
              except OSError:
                  time.sleep(0.5)
          if sock is None:
              raise RuntimeError(f"Could not connect to QMP on port {port}")

          f = sock.makefile("rw")
          f.readline()
          f.write(json.dumps({"execute": "qmp_capabilities"}) + "\n")
          f.flush()
          f.readline()

          prev = 0
          for t in (3, 15, 45, 90):
              time.sleep(t - prev)
              prev = t
              ppm = f"test-results/{mode}-{t}s.ppm"
              png = f"test-results/{mode}-{t}s.png"
              f.write(json.dumps({"execute": "screendump", "arguments": {"filename": ppm}}) + "\n")
              f.flush()
              while True:
                  resp = json.loads(f.readline())
                  if "return" in resp or "error" in resp:
                      break
              Image.open(ppm).save(png)
              print(f"Captured {png} ({Image.open(png).size})")

          sock.close()
          PY

            kill "${qpid}" 2>/dev/null || true
            wait "${qpid}" 2>/dev/null || true
          }

          run_boot_test "bios" "4444" ""

          OVMF_CODE="$(find /usr/share/OVMF /usr/share/ovmf -name 'OVMF_CODE*.fd' ! -name '*secboot*' ! -name '*ms*' ! -name '*snakeoil*' 2>/dev/null | head -n 1)"
          if [[ -n "${OVMF_CODE}" ]]; then
            run_boot_test "uefi" "4445" "-drive if=pflash,format=raw,readonly=on,file=${OVMF_CODE}"
          else
            echo "OVMF_CODE not found; skipping UEFI test."
          fi

      - name: Upload QEMU boot screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-test-${{ github.run_id }}
          path: test-results/*.png
          retention-days: 7
